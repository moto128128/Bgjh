<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu | Bright Bite POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🍔</div>
        <div>
          <div>Bright Bite POS</div>
          <div style="font-size:0.9rem;color:var(--muted);font-weight:600;">Menu and order management</div>
        </div>
      </div>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link active" href="menu.html">Menu</a>
        <a class="nav-link" href="order.html">Order</a>
      </nav>
    </header>

    <section class="hero">
      <div class="card">
        <div class="badge">📝 Flexible menu builder</div>
        <h1>Update menu items, pricing, and descriptions instantly.</h1>
        <p>The menu is now a living page where you can add new dishes and edit the featured offers without touching code.</p>
        <div class="form-grid">
          <label>
            <div style="font-weight:700;margin-bottom:6px;">New item name</div>
            <input id="newItemName" class="input" placeholder="Spicy Tacos" />
          </label>
          <label>
            <div style="font-weight:700;margin-bottom:6px;">Price</div>
            <input id="newItemPrice" class="input" type="number" step="0.01" placeholder="6.99" />
          </label>
          <label>
            <div style="font-weight:700;margin-bottom:6px;">Description</div>
            <textarea id="newItemDescription" class="textarea" placeholder="Describe the new item..."></textarea>
          </label>
          <button class="btn btn-primary" onclick="addMenuItemFromForm()">Add to menu</button>
        </div>
      </div>
      <div class="card">
        <h3>Featured menu</h3>
        <div id="menuList" class="menu-grid"></div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast">Saved</div>
  <script src="app.js"></script>
</body>
</html>
