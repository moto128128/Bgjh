<!DOCTYPE html><html><head><meta charset="UTF-8"><title>POS</title><style>body{font-family:sans-serif;display:flex;margin:0;background:#eee}.pane{flex:1;padding:15px;overflow-y:auto;background:#fff;border:1px solid #ccc;margin:10px;border-radius:6px}.row{display:flex;justify-content:space-between;margin:4px 0}button{padding:8px;margin:2px;cursor:pointer;font-weight:bold}</style></head><body>
<div class="pane">
    <div style="background:#e3f2fd;padding:8px;margin-bottom:10px;">
        <strong>🔍 Points Lookup:</strong><br>
        <input type="text" id="s-name" placeholder="Name" style="width:60%;">
        <button onclick="lkup()">Search</button>
        <div id="lk-res" style="margin-top:4px;font-weight:bold;color:#0d47a1;"></div>
    </div>
    <h3>Order Menu</h3>
    <button onclick="add('Big Mac',5.89)">🍔 Big Mac ($5.89)</button>
    <button onclick="add('Cheese Burger',2.29)">🍔 Cheeseburger ($2.29)</button>
    <button onclick="add('Fries',3.49)">🍟 Fries ($3.49)</button>
    <button onclick="add('Drink',1.69)">🥤 Drink ($1.69)</button>
</div>
<div class="pane">
    <h3>Current Order</h3>
    Name: <input type="text" id="c-name" value="Jim" style="width:80%;"><br>
    Email: <input type="email" id="c-mail" placeholder="customer@gmail.com" style="width:80%; margin:4px 0;"><br>
    <input type="checkbox" id="is-del" onchange="toggleDel()"> 🚚 Delivery Order
    <input type="text" id="addr" placeholder="Address" style="display:none;width:80%;margin-top:4px;">
    <hr><div id="tape"></div><hr>
    <div class="row" style="font-size:1.2rem;font-weight:bold;color:#da291c;"><span>Total:</span><span id="total">$0.00</span></div>
    <div class="row">
        <button onclick="setPay('cash')" id="b-cash" style="background:#ffbc0d;">💵 Cash</button>
        <button onclick="setPay('card')">💳 Card</button>
        <button onclick="setPay('points')">🪙 Points</button>
    </div>
    <div id="cash-box">Paid: <input type="number" id="paid" step="0.01" style="width:50px;"></div>
    <div id="del-warn" style="display:none;color:#856404;">⚠️ Collect cash on route.</div>
    <div id="pts-box" style="display:none;color:#0d47a1;"><span id="p-cost">Cost: 0 pts</span></div>
    <button onclick="checkout()" style="background:#da291c;color:#fff;width:100%;padding:10px;margin-top:10px;">Process Transaction</button>
    <div id="rcpt-tools" style="display:none;margin-top:8px;"><button onclick="sendGmail()">📬 Gmail</button><button onclick="downloadRcpt()">💾 Download</button></div>
</div>
<script>
    const db={"john":500,"jim":2400,"sam":1500}; let cart=[], payMethod='cash', total=0, receiptStr="", orderName="";
    function add(n,p){let m=cart.find(c=>c.n===n); m?m.qty++:cart.push({n,p,qty:1}); render()}
    function render(){document.getElementById('tape').innerHTML=cart.map(i=>`<div class="row"><span>${i.n} x${i.qty}</span><span>$${(i.p*i.qty).toFixed(2)}</span></div>`).join(''); total=cart.reduce((s,i)=>s+(i.p*i.qty),0); document.getElementById('total').innerText=`$${total.toFixed(2)}`; if(payMethod==='points')pUpd()}
    function toggleDel(){const d=document.getElementById('is-del').checked; document.getElementById('addr').style.display=d?'block':'none'; if(payMethod==='cash'){document.getElementById('cash-in').style.display=d?'none':'block'; document.getElementById('del-warn').style.display=d?'block':'none'}}
    function pCost(){return Math.ceil(total)*100}
    function pUpd(){const k=document.getElementById('c-name').value.trim().toLowerCase(); document.getElementById('p-cost').innerText=`Cost: ${pCost()} PTS | Bal: ${db[k]||0} PTS`}
    function setPay(m){payMethod=m; const d=document.getElementById('is-del').checked; document.getElementById('cash-box').style.display=m==='cash'&&!d?'block':'none'; document.getElementById('del-warn').style.display=m==='cash'&&d?'block':'none'; document.getElementById('pts-box').style.display=m==='points'?'block':'none'; if(m==='points')pUpd()}
    function lkup(){const s=document.getElementById('s-name').value.trim().toLowerCase(); const res=document.getElementById('lk-res'); if(!s)return; if(db[s]!==undefined)res.innerText=`👤 ${s.toUpperCase()} has ${db[s]} PTS.`; else{res.innerText=`❌ Added new profile (0 PTS).`; db[s]=0}}
    function checkout(){
        if(!cart.length)return alert("Order empty!"); orderName=document.getElementById('c-name').value.trim()||"Customer"; const k=orderName.toLowerCase(); const d=document.getElementById('is-del').checked; if(d&&!document.getElementById('addr').value.trim())return alert("Enter address!"); if(db[k]===undefined)db[k]=0; let chg="",msg="";
        if(payMethod==='points'){let req=pCost(); if(db[k]<req)return alert(`Need ${req} PTS. Balance: ${db[k]}`); db[k]-=req; msg=`POINTS\nFREE\n-${req} PTS`; chg=`Deducted -${req} PTS. New Bal: ${db[k]}`}else{let e=Math.floor(total)*100; if(d&&payMethod==='cash')msg=`DELIVERY\nAddr: ${document.getElementById('addr').value}\nCollect: $${total.toFixed(2)}`; else if(payMethod==='cash'){let amt=parseFloat(document.getElementById('paid').value||0); if(amt<total)return alert("Short cash!"); msg=`CASH\nChange: $${(amt-total).toFixed(2)}`}else msg="CARD\nApproved."; db[k]+=e; chg=`Added +${e} PTS. New Bal: ${db[k]}`}
        receiptStr=`=== RECEIPT ===\nCustomer: ${orderName}\nTotal: $${total.toFixed(2)}\nStatus: ${msg}\nProfile: ${chg}`; alert(`== SUCCESS ==\n${msg}\n\n📊 UPDATED:\n${chg}`); document.getElementById('rcpt-tools').style.display='block'; document.getElementById('lk-res').innerText=""; cart=[]; document.getElementById('paid').value=''; document.getElementById('addr').value=''; document.getElementById('is-del').checked=false; toggleDel(); render();
    }
    function downloadRcpt(){const blob=new Blob([receiptStr],{type:"text/plain"}); const l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download=`Receipt_${orderName}.txt`; l.click()}
    function sendGmail(){const e=document.getElementById('c-mail').value.trim(); if(!e)return alert("Enter email!"); window.open(`https://google.com{e}&su=${encodeURIComponent('Receipt')}&body=${encodeURIComponent(receiptStr)}`,'_blank')}
</script></body></html>
