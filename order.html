<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order | Bright Bite POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🧾</div>
        <div>
          <div>Bright Bite POS</div>
          <div style="font-size:0.9rem;color:var(--muted);font-weight:600;">Take orders and process payments</div>
        </div>
      </div>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="menu.html">Menu</a>
        <a class="nav-link active" href="order.html">Order</a>
      </nav>
    </header>

    <section class="hero">
      <div class="card">
        <div class="badge">💳 Working checkout flow</div>
        <h1>Create a polished order in seconds.</h1>
        <p>Choose items, toggle delivery, and complete checkout with cash, card, or points. Everything updates instantly.</p>
        <div class="form-grid">
          <label>
            <div style="font-weight:700;margin-bottom:6px;">Customer name</div>
            <input id="customerName" class="input" value="Jamie" />
          </label>
          <label>
            <div style="font-weight:700;margin-bottom:6px;">Email</div>
            <input id="customerEmail" class="input" placeholder="customer@example.com" />
          </label>
          <label>
            <input id="isDelivery" type="checkbox" />
            <span style="margin-left:8px;">Delivery order</span>
          </label>
          <label id="addressBlock" style="display:none;">
            <div style="font-weight:700;margin-bottom:6px;">Address</div>
            <input id="deliveryAddress" class="input" placeholder="123 Main St" />
          </label>
        </div>
      </div>
      <div class="card">
        <h3>Current order</h3>
        <div id="orderList" class="order-list"></div>
        <div class="summary">
          <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem;"><span>Total</span><span id="orderTotal">$0.00</span></div>
          <div class="payment-row">
            <button class="btn payment-btn btn-secondary active" data-method="cash">Cash</button>
            <button class="btn payment-btn btn-secondary" data-method="card">Card</button>
            <button class="btn payment-btn btn-secondary" data-method="points">Points</button>
          </div>
          <div class="spacer"></div>
          <label id="cashInputBlock">
            <div style="font-weight:700;margin-bottom:6px;">Cash received</div>
            <input id="cashAmount" class="input" type="number" step="0.01" placeholder="0.00" />
          </label>
          <div id="pointsBlock" style="display:none;color:var(--accent-2);font-weight:700;">Points required: <span id="pointsCost">0</span></div>
          <div class="spacer"></div>
          <button class="btn btn-danger" style="width:100%;" onclick="completeOrder()">Process transaction</button>
          <div class="spacer"></div>
          <div id="receiptActions" style="display:none;">
            <button class="btn btn-secondary" onclick="sendReceiptEmail()">Send email</button>
            <button class="btn btn-success" onclick="downloadReceipt()">Download receipt</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast">Saved</div>
  <script src="app.js"></script>
</body>
</html>
